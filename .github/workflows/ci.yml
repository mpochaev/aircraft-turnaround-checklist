name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Сборка, тесты, проверка границ модулей
        run: ./mvnw -B verify
      - name: Схема модулей
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modules
          path: target/spring-modulith-docs
          if-no-files-found: ignore
