name: Задача
description: Работа по требованию ЧТЗ или методу спецификации API
labels: []
body:
  - type: dropdown
    id: team
    attributes:
      label: Команда
      options: [Авторизация, Справочники, Бизнес-логика, Данные, Все]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Что сделать
      description: Метод API, экран, миграция
    validations:
      required: true
  - type: input
    id: refs
    attributes:
      label: Требования и проверка
      placeholder: ФТ-35, спецификация 7.7, сценарий ПМИ 31
  - type: textarea
    id: done
    attributes:
      label: Когда задача выполнена
      placeholder: Сценарий ПМИ проходит на стенде
