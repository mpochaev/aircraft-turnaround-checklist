<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Справочники</title>

    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/ui.css">
    <link rel="stylesheet" href="/css/ref.css">
    <script type="module" src="/js/ref.js"></script>
</head>
<body>
<header class="app-header"></header>

<main class="page ref-page" id="page">
    <div class="split">
        <nav aria-label="Справочники">
            <ul class="list" id="dicts"></ul>
        </nav>

        <section aria-labelledby="title">
            <h1 id="title">Нормативы операций</h1>

            <div class="toolbar">
                <label id="type-filter">
                    Тип ВС
                    <select class="select" id="aircraft-type" aria-label="Тип ВС"></select>
                </label>

                <label id="airport-filter" class="hidden">
                    Аэропорт
                    <select class="select" id="airport" aria-label="Аэропорт"></select>
                </label>

                <label>
                    <span class="hidden">Поиск</span>
                    <input class="input" type="search" id="search"
                           placeholder="Поиск" maxlength="50" aria-label="Поиск">
                </label>

                <label>
                    <input type="checkbox" id="inactive">
                    показывать неактивные
                </label>

                <div class="actions">
                    <button class="btn" type="button" id="add" disabled>Добавить</button>
                    <button class="btn" type="button" id="edit" disabled>Изменить</button>
                    <button class="btn" type="button" id="deactivate" disabled>Деактивировать</button>
                </div>
            </div>

            <p class="muted small" id="state" role="status" aria-live="polite"></p>

            <div class="table-wrap">
                <table class="table" id="table" aria-label="Записи справочника"></table>
            </div>

            <div class="ref-pagination">
                <label>Строк на странице
                    <select class="select" id="page-size">
                        <option>10</option><option selected>25</option><option>50</option>
                    </select>
                </label>
                <div id="pager"></div>
            </div>
        </section>
    </div>
</main>

<dialog class="dialog" id="editor" aria-labelledby="editor-title">
    <form id="form" novalidate>
        <div class="editor-header">
            <h2 id="editor-title"></h2>
            <button type="button" class="btn" id="close-editor" aria-label="Закрыть">×</button>
        </div>
        <div id="form-error"></div>
        <div id="fields"></div>

        <div class="actions">
            <button class="btn" type="button" id="cancel">Отмена</button>
            <button class="btn btn-primary" type="submit" id="save">Сохранить</button>
        </div>
    </form>
</dialog>
</body>
</html>
