<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Профиль</title>
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/ui.css">
</head>
<body>
<header class="app-header"></header>
<main class="page" id="page">
    <div class="page-header"><h1>Профиль</h1></div>
    <div class="panel" style="max-width: 640px">
        <h2 style="margin-top: 0">Мои данные</h2>
        <table class="table" id="me"></table>
        <p class="wip">Заявку на изменение ФИО и смену пароля делает команда «Авторизация» вместе с Keycloak: спецификация API 5.5, 5.6, 10.2.</p>
    </div>
    <h2>Мои действия за смену</h2>
    <div class="table-wrap">
        <table class="table">
            <thead><tr><th>Время</th><th>Действие</th><th>Объект</th><th>Было</th><th>Стало</th></tr></thead>
            <tbody id="rows"></tbody>
        </table>
    </div>
</main>
<script type="module">
    import { startPage, showError } from '/js/layout.js';
    import { api } from '/js/api.js';
    import { localIso, escapeHtml } from '/js/format.js';
    import { logRows } from '/js/journal.js';

    const me = await startPage({ active: 'profile' });
    const fio = [me.lastName, me.firstName, me.middleName].filter(Boolean).join(' ') || '—';
    document.getElementById('me').innerHTML = `
        <tr><td>Логин</td><td>${escapeHtml(me.login)}</td></tr>
        <tr><td>ФИО</td><td>${escapeHtml(fio)}</td></tr>
        <tr><td>Роли</td><td>${escapeHtml(me.roles.join(', '))}</td></tr>
        <tr><td>Права</td><td class="small">${escapeHtml(me.permissions.join(', '))}</td></tr>`;
    // Мои действия за смену (ФТ-42): за последние 12 часов, это наибольшая длина сессии по ЧТЗ.
    // Блок делает команда «Данные», записи отдаёт GET /log (спецификация 8.1, 10.2).
    try {
        const shiftStart = new Date(Date.now() - 12 * 3600 * 1000);
        const { items } = await api.get('/log', { from: localIso(shiftStart), to: localIso(), userId: me.id, size: 100 });
        document.getElementById('rows').innerHTML = logRows(items, { user: false, withDate: shiftStart.getDate() !== new Date().getDate() });
        document.getElementById('rows').addEventListener('click', (e) => {
            const tr = e.target.closest('tr[data-turnaround]');
            if (tr) {
                location.href = `/technician/checklist.html?id=${tr.dataset.turnaround}`;
            }
        });
    } catch (e) {
        showError(document.getElementById('page'), e);
    }
</script>
</body>
</html>
