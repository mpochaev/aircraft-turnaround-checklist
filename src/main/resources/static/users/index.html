<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Пользователи и доступ</title>
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/ui.css">
</head>
<body>
<header class="app-header"></header>
<main class="page" id="page">
    <div class="page-header"><h1>Пользователи и доступ</h1><button class="btn btn-primary" id="add-user">Добавить сотрудника</button></div>
    <div class="tabs" role="tablist">
        <button class="tab active" data-tab="users" role="tab">Пользователи</button>
        <button class="tab" data-tab="requests" role="tab">Заявки <span id="request-count"></span></button>
        <button class="tab" data-tab="roles" role="tab">Роли и права</button>
    </div>
    <section id="users-panel">
        <div class="filters">
            <label class="field"><span>Роль</span><select id="user-role"><option value="">Все</option></select></label>
            <label class="field"><span>Статус</span><select id="user-active"><option value="">Все</option><option value="true">Активные</option><option value="false">Отключённые</option></select></label>
            <button class="btn" id="refresh-users">Обновить</button>
        </div>
        <div class="table-wrap"><table class="table"><thead><tr><th>Логин</th><th>ФИО</th><th>Роли</th><th>Статус</th><th>Действия</th></tr></thead><tbody id="users"></tbody></table></div>
    </section>
    <section id="requests-panel" hidden>
        <div class="filters">
            <label class="field"><span>Статус</span><select id="request-status"><option value="pending">Открытые</option><option value="approved">Подтверждённые</option><option value="rejected">Отклонённые</option></select></label>
            <label class="field"><span>Вид</span><select id="request-kind"><option value="">Все</option><option value="personal_data">Изменение ФИО</option><option value="password_reset">Сброс пароля</option></select></label>
        </div>
        <div class="table-wrap"><table class="table"><thead><tr><th>Создана</th><th>Сотрудник</th><th>Заявка</th><th>Текущие данные</th><th>Новые данные</th><th>Причина</th><th>Решение</th></tr></thead><tbody id="requests"></tbody></table></div>
    </section>
    <section id="roles-panel" hidden>
        <div class="page-header"><h2>Роли</h2><button class="btn btn-primary" id="add-role">Новая роль</button></div>
        <div class="table-wrap"><table class="table"><thead><tr><th>Код</th><th>Название</th><th>Сотрудников</th><th>Права</th><th></th></tr></thead><tbody id="roles"></tbody></table></div>
    </section>
</main>

<dialog id="user-dialog">
    <form id="user-form">
        <h2 id="user-title">Новый сотрудник</h2>
        <label class="field"><span>Логин</span><input name="login" required minlength="3" maxlength="50" pattern="[a-z0-9._]+"></label>
        <label class="field"><span>Фамилия</span><input name="lastName" required maxlength="50"></label>
        <label class="field"><span>Имя</span><input name="firstName" required maxlength="50"></label>
        <label class="field"><span>Отчество</span><input name="middleName" maxlength="50"></label>
        <fieldset><legend>Роли</legend><div id="user-role-choices"></div></fieldset>
        <fieldset id="account-actions" hidden>
            <legend>Учётная запись</legend>
            <label class="field"><span><input type="checkbox" name="isActive" checked> Учётная запись активна</span></label>
            <label class="field"><span><input type="checkbox" name="unlock"> Снять блокировку</span></label>
            <label class="field"><span><input type="checkbox" name="resetPassword"> Выдать временный пароль</span></label>
        </fieldset>
        <div class="page-header"><button class="btn" type="button" data-close>Отмена</button><button class="btn btn-primary">Создать</button></div>
    </form>
</dialog>

<dialog id="role-dialog">
    <form id="role-form">
        <h2 id="role-title">Новая роль</h2>
        <label class="field"><span>Код (a–z, _)</span><input name="code" required minlength="3" maxlength="30" pattern="[a-z_]+"></label>
        <label class="field"><span>Название</span><input name="name" required maxlength="50"></label>
        <fieldset><legend>Права</legend><div id="permission-choices"></div></fieldset>
        <div class="page-header"><button class="btn" type="button" data-close>Отмена</button><button class="btn btn-primary">Сохранить</button></div>
    </form>
</dialog>
<dialog id="review-dialog">
    <form id="review-form">
        <h2>Решение по заявке</h2><p id="review-summary"></p>
        <label class="field"><span>Комментарий (обязателен при отклонении)</span><textarea name="comment" maxlength="300"></textarea></label>
        <div class="page-header"><button class="btn" type="button" data-close>Отмена</button><button class="btn" name="decision" value="rejected">Отклонить</button><button class="btn btn-primary" name="decision" value="approved">Подтвердить</button></div>
    </form>
</dialog>
<script type="module">
    import { startPage, showError } from '/js/layout.js';
    import { api } from '/js/api.js';
    import { escapeHtml } from '/js/format.js';
    const page = document.querySelector('#page');
    await startPage({ active: 'users' });
    const $ = (s) => document.querySelector(s);
    const dialogs = ['#user-dialog','#role-dialog','#review-dialog'].map($);
    document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => b.closest('dialog').close()));
    const alertPassword = value => value && window.alert('Временный пароль показывается один раз. Передайте его сотруднику безопасным способом:\n\n' + value);
    async function safe(fn) { try { await fn(); } catch (e) { showError(page,e); } }
    async function loadRoles() {
        const roles = await api.get('/roles');
        $('#user-role').innerHTML = '<option value="">Все</option>' + roles.map(r=>'<option value="'+escapeHtml(r.code)+'">'+escapeHtml(r.name)+'</option>').join('');
        $('#user-role-choices').innerHTML = roles.map(r=>'<label class="field"><span><input type="checkbox" value="'+r.id+'"> '+escapeHtml(r.name)+'</span></label>').join('');
        $('#roles').innerHTML = roles.map(r=>'<tr><td>'+escapeHtml(r.code)+'</td><td>'+escapeHtml(r.name)+(r.isSystem?' <span class="badge">системная</span>':'')+'</td><td>'+r.usersCount+'</td><td class="small">'+r.permissions.map(escapeHtml).join(', ')+'</td><td><button class="btn" data-edit-role="'+r.id+'">Изменить</button></td></tr>').join('');
        $('#roles').querySelectorAll('[data-edit-role]').forEach(button=>button.addEventListener('click',()=>editRole(roles.find(r=>r.id===Number(button.dataset.editRole)))));
        return roles;
    }
    async function loadUsers() {
        const params={page:1,size:100};
        if ($('#user-role').value) params.role=$('#user-role').value;
        if ($('#user-active').value) params.isActive=$('#user-active').value;
        const {items}=await api.get('/users',params);
        $('#users').innerHTML=items.map(u=>'<tr><td>'+escapeHtml(u.login)+'</td><td>'+escapeHtml(u.fullName)+'</td><td>'+u.roles.map(r=>escapeHtml(r.name)).join(', ')+'</td><td>'+(u.isActive?'Активен':'Отключён')+(u.lockedUntil?' · заблокирован':'')+'</td><td><button class="btn" data-edit-user="'+u.id+'">Изменить</button></td></tr>').join('');
        $('#users').querySelectorAll('[data-edit-user]').forEach(button=>button.addEventListener('click',()=>editUser(items.find(u=>u.id===Number(button.dataset.editUser)))));
    }
    async function loadRequests() {
        const params={status:$('#request-status').value,page:1,size:100};
        if ($('#request-kind').value) params.kind=$('#request-kind').value;
        const {items,total}=await api.get('/change-requests',params);
        $('#request-count').textContent=$('#request-status').value==='pending' && total?'('+total+')':'';
        $('#requests').innerHTML=items.map(r=>'<tr><td>'+escapeHtml(r.createdAt)+'</td><td>'+escapeHtml(r.user.fullName)+'</td><td>'+ (r.kind==='personal_data'?'Изменение ФИО':'Сброс пароля')+'</td><td>'+escapeHtml(JSON.stringify(r.currentData||{}))+'</td><td>'+escapeHtml(JSON.stringify(r.newData||{}))+'</td><td>'+escapeHtml(r.reason||'—')+'</td><td>'+(r.status==='pending'?'<button class="btn" data-review="'+r.id+'">Решить</button>':escapeHtml(r.status))+'</td></tr>').join('');
        $('#requests').querySelectorAll('[data-review]').forEach(button=>button.addEventListener('click',()=>review(items.find(r=>r.id===Number(button.dataset.review)))));
    }
    async function loadPermissions() {
        const ps=await api.get('/permissions');
        $('#permission-choices').innerHTML=ps.map(p=>'<label class="field"><span><input type="checkbox" value="'+escapeHtml(p.code)+'"> '+escapeHtml(p.code)+' — '+escapeHtml(p.description)+'</span></label>').join('');
    }
    document.querySelectorAll('[data-tab]').forEach(button=>button.addEventListener('click',()=>{
        document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b===button));
        ['users','requests','roles'].forEach(name=>$('#'+name+'-panel').hidden=name!==button.dataset.tab);
        if(button.dataset.tab==='requests') safe(loadRequests);
    }));
    $('#user-role').addEventListener('change',()=>safe(loadUsers));
    $('#user-active').addEventListener('change',()=>safe(loadUsers));
    $('#refresh-users').addEventListener('click',()=>safe(loadUsers));
    $('#request-status').addEventListener('change',()=>safe(loadRequests));
    $('#request-kind').addEventListener('change',()=>safe(loadRequests));
    $('#add-user').addEventListener('click',async()=>{await safe(async()=>{await loadRoles(); $('#user-form').reset(); $('#account-actions').hidden=true; $('#user-form [name=login]').disabled=false; $('#user-title').textContent='Новый сотрудник'; $('#user-form').dataset.id=''; $('#user-dialog').showModal();});});
    function editUser(u) {
        const f=$('#user-form'); f.reset(); f.dataset.id=u.id; f.login.value=u.login; f.login.disabled=true;
        f.lastName.value=u.lastName||'';f.firstName.value=u.firstName||'';f.middleName.value=u.middleName||'';
        $('#account-actions').hidden=false; f.isActive.checked=u.isActive; f.unlock.checked=Boolean(u.lockedUntil);
        $('#user-title').textContent='Изменить сотрудника';
        $('#user-role-choices').querySelectorAll('input').forEach(c=>c.checked=u.roles.some(r=>r.id===Number(c.value)));
        $('#user-dialog').showModal();
    }
    $('#user-form').addEventListener('submit',e=>{e.preventDefault();safe(async()=>{
        const f=e.currentTarget, fd=new FormData(f), roleIds=[...$('#user-role-choices').querySelectorAll('input:checked')].map(c=>Number(c.value));
        const body={lastName:fd.get('lastName'),firstName:fd.get('firstName'),middleName:fd.get('middleName')||null};
        let result;
        if(f.dataset.id) {
            body.roleIds=roleIds;
            body.isActive=f.isActive.checked;
            if(f.resetPassword.checked) body.resetPassword=true;
            if(f.unlock.checked) body.unlock=true;
            result=await api.patch('/users/'+f.dataset.id,body);
            alertPassword(result.temporaryPassword);
        } else {
            $('#account-actions').hidden=true;
            body.login=fd.get('login'); body.roleIds=roleIds;
            result=await api.post('/users',body); alertPassword(result.temporaryPassword);
        }
        $('#user-dialog').close(); await loadUsers();
    });});
    $('#add-role').addEventListener('click',()=>safe(async()=>{await loadPermissions();const f=$('#role-form');f.reset();f.code.disabled=false;f.dataset.id='';$('#role-title').textContent='Новая роль';$('#role-dialog').showModal();}));
    function editRole(r) { const f=$('#role-form'); f.reset();f.dataset.id=r.id;f.code.value=r.code;f.code.disabled=true;f.name.value=r.name;$('#role-title').textContent='Права роли '+r.name;$('#permission-choices').querySelectorAll('input').forEach(c=>c.checked=r.permissions.includes(c.value));$('#role-dialog').showModal(); }
    $('#role-form').addEventListener('submit',e=>{e.preventDefault();safe(async()=>{const f=e.currentTarget,fd=new FormData(f),permissionCodes=[...$('#permission-choices').querySelectorAll('input:checked')].map(c=>c.value);if(f.dataset.id) await api.patch('/roles/'+f.dataset.id,{name:fd.get('name'),permissionCodes});else await api.post('/roles',{code:fd.get('code'),name:fd.get('name'),permissionCodes});f.closest('dialog').close();await loadRoles();});});
    async function review(r) { $('#review-summary').textContent=r.user.fullName+' — '+(r.kind==='personal_data'?'изменение ФИО':'сброс пароля');const d=$('#review-dialog'),f=$('#review-form');f.reset();d.showModal();f.onsubmit=async e=>{e.preventDefault();const decision=e.submitter.value;await safe(async()=>{const result=await api.patch('/change-requests/'+r.id,{status:decision,comment:new FormData(f).get('comment')||null});alertPassword(result.temporaryPassword);d.close();await loadRequests();});}; }
    await safe(async()=>{await loadRoles();await loadPermissions();await loadUsers();});
</script>
</body>
</html>
