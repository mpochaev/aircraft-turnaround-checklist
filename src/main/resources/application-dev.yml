# Профиль dev: Keycloak не нужен, все запросы идут от sup01 (супервайзер).
# Другого пользователя можно подставить заголовками X-Dev-User и X-Dev-Roles (см. DevAuthenticationFilter).
app:
  security:
    mode: dev
  keycloak-events:
    # без Keycloak событий входа нет; включить: KEYCLOAK_EVENTS=true при запущенном Keycloak
    enabled: ${KEYCLOAK_EVENTS:false}
